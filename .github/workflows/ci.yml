# Continuous integration for this teaching lab.
# GitHub reads this file when a matching event happens in the repository.

name: CI

# Run on every push to main, and on every pull request that targets main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A job is one virtual machine plus the steps that share it.
jobs:
  test:
    name: Run pytest
    runs-on: ubuntu-latest
    steps:
      # A step is one task. "uses" calls a published GitHub Action.
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # "run" executes a shell command on the runner.
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run pytest
        run: pytest
